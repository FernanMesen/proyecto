# =============================================
# BOLSA DE EMPLEO — SQL Server (Docker Mac)
# =============================================

# --- Conexión SQL Server ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=bolsa_empleo;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=StrongPass123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# --- Thymeleaf ---
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --- Subida de archivos (CV en PDF) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.cv.upload-dir=./uploads/cv

# --- Puerto ---
server.port=8080
