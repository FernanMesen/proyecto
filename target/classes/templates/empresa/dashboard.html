<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Empresa — Bolsa de Empleo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <div class="nav">
        <div class="logo"><a href="/">BolsaEmpleo</a></div>
        <div class="menu">
            <a th:href="@{/empresa/puestos}">Mis puestos</a>
            <a th:href="@{/empresa/puestos/nuevo}">Nuevo puesto</a>
        </div>
        <div class="login">
            <span class="usuario-nombre" th:text="${empresa.nombre}">Empresa</span>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-salir">Salir</button>
            </form>
        </div>
    </div>
</header>

<main>
    <div class="tarjeta-dashboard">
        <h1>Bienvenido, <span th:text="${empresa.nombre}">Empresa</span></h1>
        <p class="subtitulo" th:text="${empresa.localizacion}">Localización</p>
        <p th:text="${empresa.descripcion}">Descripción</p>

        <div class="dashboard-acciones">
            <a th:href="@{/empresa/puestos}" class="btn btn-primario">Ver mis puestos</a>
            <a th:href="@{/empresa/puestos/nuevo}" class="btn btn-exito">Publicar nuevo puesto</a>
        </div>
    </div>
</main>

<footer>
    <div class="footer-left"><strong>Bolsa de Empleo</strong><p>Total Soft Inc.</p></div>
    <div class="footer-right"><p>Contacto: info@bolsaempleo.local</p></div>
</footer>
</body>
</html>
