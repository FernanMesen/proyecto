<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Bolsa de Empleo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <div class="nav">
        <div class="logo">
            <a href="/">
                <img th:src="@{/images/ofertasEmpleo.png}" alt="Logo BolsaEmpleo" class="logo-img">
                <span>BolsaEmpleo</span>
            </a>
        </div>
        <div class="menu">
            <a th:href="@{/puestos/buscar}">Buscar Puestos</a>
            <a th:href="@{/registro/empresa}">Registrar Empresa</a>
            <a th:href="@{/registro/oferente}">Registrar Oferente</a>
        </div>
        <div class="login">
            <a th:href="@{/login}" class="activo login-link-con-icono">
                <img th:src="@{/images/enter.png}" alt="Entrar" class="enter-icono">
                <span>Login</span>
            </a>
        </div>
    </div>
</header>

<main>
    <div class="login-wrapper">
        <div class="login-caja">
            <h2>Login</h2>

            <div class="login-avatar-contenedor">
                <img th:src="@{/images/login.png}" alt="Usuario" class="login-avatar">
            </div>

            <div class="alerta alerta-error" th:if="${error}" th:text="${error}"></div>
            <div class="alerta alerta-exito" th:if="${info}" th:text="${info}"></div>
            <div class="alerta alerta-error" th:if="${param.error != null}">Usuario o contraseña incorrectos, o cuenta pendiente de aprobación.</div>
            <div class="alerta alerta-exito" th:if="${param.logout != null}">Has cerrado sesión correctamente.</div>

            <form th:action="@{/login}" method="post">
                <div class="form-grupo">
                    <label for="username">Correo electrónico</label>
                    <input type="email" id="username" name="username" placeholder="correo@empresa.com" required autofocus>
                </div>
                <div class="form-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-primario">Entrar</button>
            </form>
        </div>
    </div>
</main>

<footer>
    <div class="footer-left"><strong>Bolsa de Empleo</strong><p>Universidad Nacional de Costa Rica</p></div>
    <div class="footer-right"><p>Contacto: info@bolsaempleo.local</p></div>
</footer>
</body>
</html>
