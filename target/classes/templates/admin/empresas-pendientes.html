<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas Pendientes — Bolsa de Empleo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <div class="nav">
        <div class="logo"><a href="/">BolsaEmpleo</a></div>
        <div class="menu">
            <a th:href="@{/admin/dashboard}">Panel</a>
            <a th:href="@{/admin/empresas/pendientes}" class="activo">Empresas</a>
            <a th:href="@{/admin/oferentes/pendientes}">Oferentes</a>
            <a th:href="@{/admin/caracteristicas}">Características</a>
            <a th:href="@{/admin/reportes}">Reportes</a>
        </div>
        <div class="login">
            <form th:action="@{/logout}" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn-salir">Salir</button>
            </form>
        </div>
    </div>
</header>

<main>
    <h1>Empresas pendientes de aprobación</h1>

    <div class="alerta alerta-exito" th:if="${param.aprobado != null}">
        Empresa aprobada: <strong th:text="${param.aprobado}"></strong>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
            <tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Localización</th><th>Descripción</th><th>Acción</th></tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${empresas}">
                <td th:text="${emp.nombre}">—</td>
                <td th:text="${emp.usuario.correo}">—</td>
                <td th:text="${emp.telefono}">—</td>
                <td th:text="${emp.localizacion}">—</td>
                <td th:text="${emp.descripcion}">—</td>
                <td>
                    <form th:action="@{/admin/empresas/{id}/aprobar(id=${emp.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-exito btn-sm">Aprobar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empresas)}">
                <td colspan="6" style="text-align:center;padding:20px" class="texto-secundario">No hay empresas pendientes.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer>
    <div class="footer-left"><strong>Bolsa de Empleo</strong><p>Universidad Nacional de Costa Rica</p></div>
    <div class="footer-right"><p>Contacto: info@bolsaempleo.local</p></div>
</footer>
</body>
</html>
